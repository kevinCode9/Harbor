<script>
    class KeyAuthAPI {
        constructor(name, ownerid, secret, version) {
            this.name = encodeURIComponent(name);
            this.ownerid = ownerid;
            this.secret = secret;
            this.version = version;
            this.sessionid = null;
            this.nonce = null;
            this.initialized = false;
        }

        async init() {
            try {
                const response = await fetch(`https://keyauth.win/api/1.2/?type=init&name=${this.name}&ownerid=${this.ownerid}&ver=${this.version}`, {
                    method: 'GET',
                    cache: 'no-cache'
                });
                
                const data = await response.json();
                console.log('Init response:', data);
                
                if (data.success && data.sessionid) {
                    this.sessionid = data.sessionid;
                    this.nonce = data.nonce;
                    this.initialized = true;
                    localStorage.setItem('keyauth_session', data.sessionid);
                    localStorage.setItem('keyauth_nonce', data.nonce);
                    return true;
                }
                return false;
            } catch (error) {
                console.error('Init error:', error);
                return false;
            }
        }

        async license(key) {
            if (!this.initialized || !this.sessionid) {
                await this.init();
            }

            try {
                const response = await fetch(`https://keyauth.win/api/1.2/?type=license&key=${encodeURIComponent(key)}&name=${this.name}&ownerid=${this.ownerid}&sessionid=${this.sessionid}&nonce=${this.nonce}`, {
                    method: 'GET',
                    cache: 'no-cache'
                });
                
                const data = await response.json();
                console.log('License response:', data);
                return data;
            } catch (error) {
                console.error('License check error:', error);
                return { success: false, message: error.toString() };
            }
        }
    }

    document.addEventListener('DOMContentLoaded', async () => {
        try {
            const keyauth = new KeyAuthAPI(
                "Panel",
                "iV3mcRgBLW",
                "b85132d8909cbef541bab258d60cc13a4d25c70337a1601390d3abcfa2c7a427",
                "1.0"
            );

            await keyauth.init();
            console.log("KeyAuth initialized");

            const keyInput = document.getElementById('key-input');
            const keyContainer = document.getElementById('key-container');
            const continueButton = document.getElementById('continue-button');

            continueButton.addEventListener('click', async (e) => {
                e.preventDefault();
                const key = keyInput.value.trim();
                if (!key) return;

                try {
                    const result = await keyauth.license(key);
                    console.log('License check:', result);
                    
                    if (result.success) {
                        keyContainer.classList.remove('ring-red-600');
                        keyContainer.classList.add('ring-2', 'ring-green-600');
                        setTimeout(() => {
                            window.location.href = './dashboard.html';
                        }, 500);
                    } else {
                        keyContainer.classList.remove('ring-green-600');
                        keyContainer.classList.add('ring-2', 'ring-red-600');
                    }
                } catch (error) {
                    console.error('License check failed:', error);
                    keyContainer.classList.add('ring-2', 'ring-red-600');
                }
            });

            keyInput.addEventListener('input', () => {
                if (keyInput.value.trim() === '') {
                    keyContainer.classList.remove('ring-2', 'ring-red-600', 'ring-green-600');
                    keyContainer.classList.add('focus-within:ring-admin-primary');
                }
            });
        } catch (error) {
            console.error('Initialization failed:', error);
        }
    });
</script>
