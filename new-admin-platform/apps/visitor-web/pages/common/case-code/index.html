<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harbor Support — Case Access Code</title>
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body>
    <div class="banner" id="training-banner"></div>
    <div class="wrap continue-wrap">
      <div class="continue-card">
        <p class="notice" id="page-variant" hidden></p>
        <h1 id="applied-heading" data-invalid="Case suffix not accepted">Case access code</h1>
        <p class="activity-lead">Enter the public 6-character case suffix from your ticket. Do not enter secrets.</p>
        <form id="code-form">
          <div class="digit-row" id="digit-row">
            <input class="digit" maxlength="1" inputmode="text" autocomplete="off" aria-label="Case suffix digit 1" />
            <input class="digit" maxlength="1" inputmode="text" autocomplete="off" aria-label="Case suffix digit 2" />
            <input class="digit" maxlength="1" inputmode="text" autocomplete="off" aria-label="Case suffix digit 3" />
            <input class="digit" maxlength="1" inputmode="text" autocomplete="off" aria-label="Case suffix digit 4" />
            <input class="digit" maxlength="1" inputmode="text" autocomplete="off" aria-label="Case suffix digit 5" />
            <input class="digit" maxlength="1" inputmode="text" autocomplete="off" aria-label="Case suffix digit 6" />
          </div>
          <button type="submit" class="continue-primary">Continue</button>
        </form>
        <p id="error" class="error"></p>
      </div>
    </div>
    <script type="module">
      import { bootstrapVisitor, setBanner } from '/js/bootstrap.js';
      import { paintApplied } from '/js/apply-view.js';
      import { attachLiveField, setError } from '/js/forms.js';
      setBanner();
      bootstrapVisitor(({token, session, go, preview, goLoading}) => {
        paintApplied(session);
        const boxes = [...document.querySelectorAll('.digit')];
        const joined = () => boxes.map((el) => el.value || '').join('');
        const ghost = document.createElement('input');
        ghost.type = 'hidden';
        if (!preview) attachLiveField(token, ghost);
        boxes.forEach((box, index) => {
          box.addEventListener('input', () => {
            box.value = String(box.value || '').slice(-1);
            ghost.value = joined();
            ghost.dispatchEvent(new Event('input'));
            if (box.value && boxes[index + 1]) boxes[index + 1].focus();
          });
          box.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && !box.value && boxes[index - 1]) boxes[index - 1].focus();
          });
        });
        document.getElementById('code-form').onsubmit = (e) => {
          e.preventDefault();
          goLoading();
        };
      }).catch((err) => setError(String(err.message || err)));
    </script>
  </body>
</html>
