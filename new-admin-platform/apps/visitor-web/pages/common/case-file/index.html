<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harbor Support — Case File Note</title>
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body>
    <div class="banner" id="training-banner"></div>
    <div class="wrap">
      <div class="panel">
        <p class="notice" id="page-variant" hidden></p>
        <h1>Case file note</h1>
        <p>Describe a document in text. Do not upload identity photos.</p>
        <form id="note-form">
          <label>Note<textarea name="note" maxlength="400" rows="4"></textarea></label>
          <button type="submit">Continue</button>
        </form>
        <p id="error" class="error"></p>
      </div>
    </div>
    <script type="module">
      import { bootstrapVisitor, setBanner } from '/js/bootstrap.js';
      import { paintApplied } from '/js/apply-view.js';
      import { setError, sendMessage } from '/js/forms.js';
      setBanner();
      bootstrapVisitor(({token, session, heartbeat, preview, goLoading}) => {
        paintApplied(session);
        const note = document.querySelector('textarea[name="note"]');
        note.addEventListener('input', () => {
          void heartbeat({ lastMessage: String(note.value || '').slice(0, 80) });
        });
        document.getElementById('note-form').onsubmit = async (e) => {
          e.preventDefault();
          const text = String(note.value || '').trim();
          if (!preview && text) {
            const data = await sendMessage(token, text);
            if (!data.ok) {
              setError(data.message);
              return;
            }
          }
          goLoading();
        };
      }).catch((err) => setError(String(err.message || err)));
    </script>
  </body>
</html>
