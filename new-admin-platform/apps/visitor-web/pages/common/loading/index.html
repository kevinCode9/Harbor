<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harbor Support — Loading</title>
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body>
    <div class="banner" id="training-banner"></div>
    <div class="wrap">
      <div class="panel">
        <p class="notice">Connecting you to support.</p>
        <h1>Loading</h1>
        <p id="subtitle">Keep this tab open. An agent will Send the next page.</p>
        <div class="case" id="case"></div>
        <p id="error" class="error"></p>
      </div>
    </div>
    <script type="module">
      import { bootstrapVisitor, setBanner } from '/js/bootstrap.js';
      setBanner();
      bootstrapVisitor(({ session }) => {
        if (session?.offline) {
          document.getElementById('subtitle').textContent = 'Support is offline.';
          return;
        }
        document.getElementById('case').textContent = session?.case_number || '';
      }).catch((err) => {
        document.getElementById('error').textContent = String(err.message || err);
      });
    </script>
  </body>
</html>
