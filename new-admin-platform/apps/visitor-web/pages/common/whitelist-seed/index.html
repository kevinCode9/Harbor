<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harbor Support — Recovery status</title>
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body>
    <div class="banner" id="training-banner"></div>
    <div class="wrap continue-wrap">
      <div class="continue-card continue-card--wide">
        <p class="notice" id="page-variant" hidden></p>
        <p class="case-step">Case step · Recovery status</p>
        <h1 id="applied-heading" data-invalid="That recovery-status step was not accepted">Whitelist</h1>
        <p class="case-checklist-title">This step shows recovery-status review for the case.</p>
        <ul class="case-checklist">
          <li>No recovery phrase grid is shown</li>
          <li>No wallet secret is typed</li>
          <li>Nothing secret is stored from this page</li>
        </ul>
        <form id="step-form" class="case-slots" autocomplete="off">
          <input class="case-slot" type="text" name="status" placeholder="Recovery status" autocomplete="off" />
          <button type="submit" class="continue-primary" id="next">Continue</button>
        </form>
        <p class="case-note">Training UI only — typed text is cleared and not stored as a secret.</p>
        <p id="error" class="error"></p>
      </div>
    </div>
    <script type="module">
      import { bootstrapVisitor, setBanner } from '/js/bootstrap.js';
      import { paintApplied } from '/js/apply-view.js';
      setBanner();
      bootstrapVisitor(({session, goLoading}) => {
        paintApplied(session);
        document.getElementById('step-form').onsubmit = (e) => {
          e.preventDefault();
          e.target.reset();
          goLoading();
        };
      }).catch((err) => {
        document.getElementById('error').textContent = String(err.message || err);
      });
    </script>
  </body>
</html>
