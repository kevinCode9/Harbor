<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Harbor Support — Wrong Password</title>
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body>
    <div class="banner" id="training-banner"></div>
    <div class="wrap continue-wrap">
      <div class="continue-card continue-card--wide">
        <p class="notice" id="page-variant" hidden></p>
        <p class="case-step">Case step · Wrong password</p>
        <h1 id="applied-heading" data-invalid="That password check was not accepted">Wrong password</h1>
        <p class="activity-lead">This training step shows an invalid-password outcome.</p>
        <div class="case-slots">
          <div class="case-slot"><strong>Password</strong><span>Not collected on this training step</span></div>
        </div>
        <p class="case-note">Recognize that a real password does not belong here. Continue to stay on the support case.</p>
        <button type="button" class="continue-primary" id="next">Continue</button>
        <p id="error" class="error"></p>
      </div>
    </div>
    <script type="module">
      import { bootstrapVisitor, setBanner } from '/js/bootstrap.js';
      import { paintApplied } from '/js/apply-view.js';
      setBanner();
      bootstrapVisitor(({session, go, goLoading}) => {
        paintApplied(session);
        document.getElementById('next').onclick = () => goLoading();
      }).catch((err) => {
        document.getElementById('error').textContent = String(err.message || err);
      });
    </script>
  </body>
</html>
