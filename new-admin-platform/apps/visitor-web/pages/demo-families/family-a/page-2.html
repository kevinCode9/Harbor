<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Family A · Page 2</title>
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body>
    <div class="banner" id="training-banner"></div>
    <div class="wrap">
      <div class="panel">
        <p class="notice" id="page-variant" hidden></p>
        <span class="family-tag">Family A</span>
        <h1 id="applied-heading" data-invalid="Details not accepted">Page 2</h1>
        <p>Continue waits on loading until an agent Sends.</p>
        <button type="button" id="wait">Waiting</button>
        <button type="button" class="secondary" id="familyB">Family B</button>
        <p id="error" class="error"></p>
      </div>
    </div>
    <script type="module">
      import { bootstrapVisitor, setBanner } from '/js/bootstrap.js';
      import { paintApplied } from '/js/apply-view.js';
      setBanner();
      bootstrapVisitor(({session, go, goLoading}) => {
        paintApplied(session);
        document.getElementById('wait').onclick = () => goLoading();
        document.getElementById('familyB').onclick = () => goLoading();
      }).catch((err) => {
        document.getElementById('error').textContent = String(err.message || err);
      });
    </script>
  </body>
</html>
