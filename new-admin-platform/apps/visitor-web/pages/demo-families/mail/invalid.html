<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title data-ui="mailDesk.invalid.documentTitle">Harbor Mail Desk — Incorrect Entry</title>
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body>
    <div class="banner" id="training-banner"></div>
    <div class="wrap continue-wrap">
      <div class="continue-card">
        <span class="family-tag" data-ui="families.mailDesk">Mail Desk</span>
        <p class="notice" id="page-variant" hidden></p>
        <h1 id="applied-heading" data-ui="mailDesk.invalid.title" data-ui-attr="data-invalid:mailDesk.invalid.invalidHeading">
          Incorrect entry
        </h1>
        <p class="activity-lead" data-ui="mailDesk.invalid.lead"></p>
        <form id="mail-form">
          <label>
            <span data-ui="mailDesk.invalid.label">Display name</span>
            <input
              name="name"
              maxlength="120"
              autocomplete="nickname"
              data-ui="mailDesk.invalid.placeholder"
              data-ui-placeholder
            />
          </label>
          <button type="submit" class="continue-primary" data-ui="mailDesk.invalid.submit">Try again</button>
        </form>
        <p id="error" class="error"></p>
      </div>
    </div>
    <script type="module">
      import { bootstrapVisitor, setBanner } from '/js/bootstrap.js';
      import { paintApplied } from '/js/apply-view.js';
      import { saveContact, setError, attachLiveField } from '/js/forms.js';
      import { paintUiCopy } from '/js/ui-copy.js';
      paintUiCopy();
      setBanner();
      bootstrapVisitor(({token, session, go, preview, goLoading}) => {
        paintApplied(session);
        const name = document.querySelector('input[name="name"]');
        if (!preview) attachLiveField(token, name);
        document.getElementById('mail-form').onsubmit = async (e) => {
          e.preventDefault();
          if (!preview) {
            const data = await saveContact(token, String(name.value || ''), '');
            if (!data.ok) {
              setError(data.message);
              return;
            }
          }
          if (preview) go('/demo/mail/signin'); else void goLoading();
        };
      }).catch((err) => setError(String(err.message || err)));
    </script>
  </body>
</html>
