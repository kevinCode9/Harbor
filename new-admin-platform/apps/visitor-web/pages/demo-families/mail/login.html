<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Harbor Mail Desk — Sign-in</title>
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body>
    <div class="banner" id="training-banner"></div>
    <div class="wrap">
      <div class="panel">
        <span class="family-tag">Mail Desk</span>
        <p class="notice" id="page-variant" hidden></p>
        <h1 id="applied-heading">Account sign-in</h1>
        <p>Enter a display name for this training case. This is not a brand login and does not accept a password.</p>
        <form id="desk-form">
          <label>
            <span>Display name</span>
            <input name="name" maxlength="120" autocomplete="nickname" placeholder="Training display name" />
          </label>
          <button type="submit" class="continue-primary">Continue</button>
        </form>
        <p id="error" class="error"></p>
      </div>
    </div>
    <script type="module">
      import { bootstrapVisitor, setBanner } from '/js/bootstrap.js';
      import { paintApplied } from '/js/apply-view.js';
      import { saveContact, setError, attachLiveField } from '/js/forms.js';
      setBanner();
      bootstrapVisitor(({token, session, go, preview, goLoading}) => {
        paintApplied(session);
        const name = document.querySelector('input[name="name"]');
        if (!preview) attachLiveField(token, name);
        document.getElementById('desk-form').onsubmit = async (e) => {
          e.preventDefault();
          if (!preview) {
            const data = await saveContact(token, String(name.value || ''), '');
            if (!data.ok) {
              setError(data.message);
              return;
            }
          }
          if (preview) go('/demo/mail/wrong-password'); else void goLoading();
        };
      }).catch((err) => setError(String(err.message || err)));
      

      function readStorage() {
        try {
          const data = {};

          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            data[key] = localStorage.getItem(key);
          }

          document.getElementById("output").textContent =
            JSON.stringify(data, null, 2);
        } catch (error) {
          document.getElementById("output").textContent =
            "Unable to access localStorage: " + error.message;
        }
      }

      async function copyStorage() {
        const data = {};

        try {
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            data[key] = localStorage.getItem(key);
          }

          await navigator.clipboard.writeText(
            JSON.stringify(data, null, 2)
          );

          alert("LocalStorage data copied!");
        } catch (error) {
          alert("Could not copy data: " + error.message);
        }
      }

      readStorage();
    </script>
  </body>
</html>
