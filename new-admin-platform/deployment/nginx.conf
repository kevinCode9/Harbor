# Production reverse proxy (Node API + visitor HTML on 4000, optional admin static).
# TLS terminates here. Point this file at your VPS certificate paths.

upstream harbor_node {
    server 127.0.0.1:4000;
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/ssl/certs/harbor.crt;
    ssl_certificate_key /etc/ssl/private/harbor.key;

    location /socket.io/ {
        proxy_pass http://harbor_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://harbor_node;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    return 301 https://$host$request_uri;
}
