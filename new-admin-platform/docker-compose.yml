services:
  postgres:
    image: postgres:16-alpine
    container_name: harbor-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: live_admin
    ports:
      - "5432:5432"
    volumes:
      - harbor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d live_admin"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  harbor_pgdata:
