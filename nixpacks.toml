[phases.setup]
nixPkgs = ["php83", "php83Packages.composer", "nodejs_22"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-scripts --ignore-platform-reqs",
  "npm install --include=optional"
]

[phases.build]
cmds = [
  "npm run build"
]

[start]
cmd = "rm -f bootstrap/cache/*.php && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"