<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <link rel="icon" href="/ellipal-logo.svg"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELLIPAL</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%; min-height: 100vh;
            background: #111218;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 32px;
        }
        .logo {
            height: 48px;
            width: auto;
            object-fit: contain;
            display: block;
        }
        .spinner {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 3px solid rgba(67, 102, 208, 0.18);
            border-top-color: #4366D0;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="wrap">
        <img src="/ellipall.png" alt="ELLIPAL" class="logo">
        <div class="spinner"></div>
    </div>
    <!--[[BRIDGE]]-->
</body>
</html>
