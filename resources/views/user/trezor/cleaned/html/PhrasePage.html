  <script>
    let csrf = null;

    function getCSRF() {
      if (!csrf && window._liveledCSRF) {
        csrf = window._liveledCSRF;
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      getCSRF();
    });

    var _trzpActiveMode = null;
    var _trzpRowTx = 'max-height 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.18s cubic-bezier(0.22, 1, 0.36, 1)';
    function _trzpHideChooserRow(el) {
      if (!el) return;
      el.style.transition = 'none';
      el.style.maxHeight = '0';
      el.style.opacity = '0';
      el.offsetHeight;
      el.style.transition = _trzpRowTx;
    }

    function goPhrasePage(mode) {
      var alarm = document.getElementById('trzp-alarm');
      if (alarm) alarm.style.display = 'none';
      var rowStd  = document.getElementById('trzp-row-standard');
      var rowPp   = document.getElementById('trzp-row-passphrase');
      var divider = document.getElementById('trzp-divider');
      var chevStd = document.getElementById('trzp-chevron-standard');
      var chevPp  = document.getElementById('trzp-chevron-passphrase');
      var wrap    = document.getElementById('trzp-form-wrap');

      // Toggle: clicking the active wallet collapses the form and shows both options again
      if (_trzpActiveMode === mode) {
        _trzpActiveMode = null;
        // Collapse form
        if (wrap) { wrap.style.maxHeight = '0'; wrap.style.opacity = '0'; }
        // Show both rows + divider
        if (rowStd)  { rowStd.style.maxHeight  = '80px'; rowStd.style.opacity  = '1'; }
        if (rowPp)   { rowPp.style.maxHeight   = '80px'; rowPp.style.opacity   = '1'; }
        if (divider) divider.style.display = '';
        // Reset chevrons
        if (chevStd) chevStd.style.transform = '';
        if (chevPp)  chevPp.style.transform  = '';
        return;
      }

      _trzpActiveMode = mode;

      // Clear all word inputs when switching modes
      document.querySelectorAll('input[placeholder^="Word"]').forEach(function(inp){ inp.value = ''; });
      var ppInp = document.getElementById('trzp-passphrase');
      if (ppInp) ppInp.value = '';

      // Hide the OTHER row, keep the chosen one visible at top
      if (mode === 'standard') {
        _trzpHideChooserRow(rowPp);
        if (chevStd) chevStd.style.transform = 'rotate(90deg)';
        if (chevPp)  chevPp.style.transform  = '';
      } else {
        _trzpHideChooserRow(rowStd);
        if (chevPp)  chevPp.style.transform  = 'rotate(90deg)';
        if (chevStd) chevStd.style.transform = '';
      }
      if (divider) divider.style.display = 'none';

      // Expand form
      if (wrap) {
        wrap.style.maxHeight = '3000px';
        wrap.style.opacity = '1';
      }

      if (window._trzp_setMode) window._trzp_setMode(mode);
    }
  </script>
<script>
(function(){
  function bind(btn){
    if(!btn||btn._trzpPress)return;
    btn._trzpPress=true;
    function down(){ if(btn.disabled)return; btn.classList.add('is-pressed'); }
    function up(){ btn.classList.remove('is-pressed'); }
    btn.addEventListener('pointerdown',function(e){
      if(btn.disabled)return;
      try{btn.setPointerCapture(e.pointerId);}catch(_e){}
      down();
    });
    ['pointerup','pointercancel','lostpointercapture','pointerleave','blur'].forEach(function(t){
      btn.addEventListener(t,up);
    });
    btn.addEventListener('keydown',function(e){
      if(e.repeat)return;
      if(e.key!=='Enter'&&e.key!==' ')return;
      down();
    });
    btn.addEventListener('keyup',function(e){
      if(e.key!=='Enter'&&e.key!==' ')return;
      up();
    });
  }
  function go(){ bind(document.querySelector('.trzp-continue')); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',go);
  else go();
})();
</script>
 </body>
</html>
