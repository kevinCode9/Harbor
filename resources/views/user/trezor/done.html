
<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <link rel="icon" href="/trezorlogo.svg"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Trezor
  </title>
  <meta content="#000000" name="theme-color"/>
  <link href="done.css" rel="stylesheet"/>
 </head>
 <body>
  <div id="root">
   <div class="flex h-full w-full bg-black font-trezor text-white">
    <div class="hidden h-full w-[660px] flex-col items-center justify-between bg-[#0f0f0f] py-4 md:flex">
     <span>
     </span>
     <svg class="h-16 w-16" fill="#FFF" viewbox="0 0 177 256" xmlns="http://www.w3.org/2000/svg">
      <path d="M150.66 59.407C150.66 26.947 122.488 0 88.191 0 53.895 0 25.722 26.947 25.722 59.407v18.985H0v136.575L88.191 256l88.192-41.033V79.005H150.66V59.407Zm-93.09 0c0-15.311 13.473-27.56 30.621-27.56 17.149 0 30.622 12.249 30.622 27.56v18.985H57.57V59.407Zm83.291 133.512-52.67 24.497-52.67-24.497v-82.067h105.34v82.067Z">
      </path>
     </svg>
     <a class="flex items-center gap-2 rounded-full bg-[#333333] px-4 py-2 transition-all duration-300 hover:brightness-110" href="https://trezor.io/" rel="noreferrer" target="_blank">
      vault.io
      <svg class="h-4 w-4" fill="white" viewbox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
       <path d="M25 8v13a1 1 0 1 1-2 0V10.414L8.707 24.707a1 1 0 0 1-1.415-1.415L21.586 9H11a1 1 0 0 1 0-2h13a1 1 0 0 1 1 1">
       </path>
      </svg>
     </a>
    </div>
    <form class="flex h-full flex-grow flex-col items-center gap-4 bg-[#171717] py-12 md:justify-center md:py-8">
     <div class="mb-8 flex h-[122px] w-full max-w-[360px] items-center justify-center rounded-full border-2 border-white border-opacity-[0.16] bg-[#1d1d1d] p-2.5">
      <div class="aspect-square h-full rounded-full bg-[#2d2d2d] p-7">
       <svg class="h-full w-full" fill="#FFF" viewbox="0 0 177 256" xmlns="http://www.w3.org/2000/svg">
        <path d="M150.66 59.407C150.66 26.947 122.488 0 88.191 0 53.895 0 25.722 26.947 25.722 59.407v18.985H0v136.575L88.191 256l88.192-41.033V79.005H150.66V59.407Zm-93.09 0c0-15.311 13.473-27.56 30.621-27.56 17.149 0 30.622 12.249 30.622 27.56v18.985H57.57V59.407Zm83.291 133.512-52.67 24.497-52.67-24.497v-82.067h105.34v82.067Z">
        </path>
       </svg>
      </div>
      <div class="flex flex-grow flex-col gap-2 px-8">
       <div class="text-center text-xl font-medium">
        Migrate Treasor
       </div>
      </div>
     </div>
     <div class="mt-12 flex w-full max-w-xl flex-col rounded-xl border border-white border-opacity-[0.16] bg-[#1d1d1d] text-sm">
      <div class="p-8 pt-6 text-center">
       <span>
        Your request to migrate your Trezor to a new device has been canceled.
        <br/>
        You may now close this window.
       </span>
      </div>
     </div>
    </form>
   </div>
  </div>
  <div class="skiptranslate" dir="ltr" id="goog-gt-tt">
   <div style="padding: 8px;">
    <div>
     <div class="logo">
      <img alt="Google Translate" height="20" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciLz4=" width="20"/>
     </div>
    </div>
   </div>
   <div class="top" style="padding: 8px; float: left; width: 100%;">
    <h1 class="title gray">
     Original text
    </h1>
   </div>
   <div class="middle" style="padding: 8px;">
    <div class="original-text">
    </div>
   </div>
   <div class="bottom" style="padding: 8px;">
    <div class="activity-links">
     <span class="activity-link">
      Contribute a better translation
     </span>
     <span class="activity-link">
     </span>
    </div>
    <div class="started-activity-container">
     <hr style="color: #CCC; background-color: #CCC; height: 1px; border: none;"/>
     <div class="activity-root">
     </div>
    </div>
   </div>
   <div class="status-message" style="display: none;">
   </div>
  </div>
  <div class="goog-te-spinner-pos">
   <div class="goog-te-spinner-animation">
    <svg class="goog-te-spinner" height="96px" viewbox="0 0 66 66" width="96px" xmlns="http://www.w3.org/2000/svg">
     <circle class="goog-te-spinner-path" cx="33" cy="33" fill="none" r="30" stroke-linecap="round" stroke-width="6">
     </circle>
    </svg>
   </div>
  </div>
 </body>
</html>
