          <span class="flex-grow text-start text-sm font-bold text-white">

         <span class="pr-2 text-xs font-semibold text-coinbase-foreground-muted">
          $

         </span>
         <svg class="lucide lucide-chevron-down h-4 w-4" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
          <path d="m6 9 6 6 6-6">
          </path>
         </svg>

       </div>
       <div class="relative">
        <div class="relative mt-5 flex w-full flex-col gap-2 text-left text-white">

          Amount
         </span>

        <button class="absolute bottom-5 right-3 text-xs font-bold text-coinbase-foreground-muted" type="button">

       <span class="px-4 py-2 text-xs text-coinbase-foreground-muted">

        0.00

       <div class="relative mt-5 flex w-full flex-col gap-2 text-left text-white">
        <span class="text-sm font-semibold">
         Withdrawal address
        </span>
        <input class="rounded-md border border-coinbase-line bg-coinbase-background px-4 py-3.5 font-coinbase-sans outline-none hover:bg-[#0f1012] focus:outline-coinbase-primary" value=""/>

       <button class="bg-coinbase-primary hover:bg-[#507fe5] disabled:bg-[#314b84] active:bg-[#4b78d6] disabled:scale-100 active:scale-[.98] mt-4 rounded-full py-4 flex font-coinbase-sans font-semibold pl-6 pr-8 text-black items-center transition-colors justify-center w-full" disabled="" type="button">
        Withdraw
       </button>
       <span class="mt-4 w-full text-center text-xs text-coinbase-foreground-muted">

       </span>

      <div data-rht-toaster="" style="position: fixed; z-index: 9999; inset: 16px; pointer-events: none;">

  <div class="skiptranslate" dir="ltr" id="goog-gt-tt">
