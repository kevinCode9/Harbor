<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#1b1b1c"/>
<title>Trust Wallet</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body,#root{margin:0;padding:0;width:100%;height:100%;background:#1b1b1c;color:#fff;font-family:Inter,system-ui,sans-serif}
.wrap{display:flex;align-items:center;justify-content:center;min-height:100%;width:100%;background:#1b1b1c;padding:16px;box-sizing:border-box}
.card{width:100%;max-width:406px;padding:24px;text-align:center;background:#1b1b1c;display:flex;flex-direction:column;align-items:center;gap:16px;box-sizing:border-box}
@media (min-width:768px){.card{border:1px solid rgba(255,255,255,.1);border-radius:4px}}
.title{font-size:1.875rem;font-weight:700;line-height:1.25;color:#fff;margin:0}
.sub{font-size:.875rem;font-weight:400;line-height:1.4;color:rgba(255,255,255,.6);margin:0}
.spinner{width:40px;height:40px;margin:32px 0;color:#fff;flex-shrink:0;animation:tw-spin .8s linear infinite}
@keyframes tw-spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root">
<div class="wrap">
<div class="card">
<h1 class="title">Disconnecting wallet</h1>
<p class="sub">Please wait while we disconnect your wallet.<br>This may take a minute.</p>
<svg class="spinner" xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="M21 12a9 9 0 1 1-6.219-8.56"/>
</svg>
</div>
</div>
</div>
</body>
</html>
